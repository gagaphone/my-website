<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>.OGalanets Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google Fonts for Modern Minimalist Look -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/pwstyle.css">
</head>
<body>

  <!-- TOP HEADER NAVIGATION -->
  <header class="main-header">
    <div class="brand-title">Photo Gallery</div>
    <button id="sidebarToggle" class="sidebar-toggle" aria-label="Toggle filters">
      <span></span>
      <span></span>
    </button>
  </header>

  <div class="layout" id="layout">
    <!-- LEFT SIDEBAR FILTERS -->
    <aside class="filters closed" id="sidebar">
      <div class="filter-container">
        <div class="filters-label">Categories</div>
        <div class="filters-inner" id="filterBar">
          <!-- Populated by JS -->
        </div>
      </div>
    </aside>

    <!-- MAIN VIEWER STAGE -->
    <main class="viewer" id="viewerContainer">
      
      
      <!-- LEFT FIXED SOCIALS (Minimalist rotated look) -->
      <div class="fixed-socials">
        <a href="https://www.instagram.com/ogalanets_fotos/" target="_blank" rel="noopener" aria-label="Instagram">Instagram</a>
      </div>

      <!-- CENTER IMAGE CANVAS -->
      <div class="image-wrap">
        <div class="progress-line">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <img id="mainImage" src="https://ogalanets.com/img/personal/MainImg.png" alt="Photography image" decoding="async" />
      </div>

      <!-- RIGHT SLIDER DOTS INDICATORS -->
      <div class="slider-dots" id="sliderDots">
        <!-- Populated by JS -->
      </div>

      <!-- RIGHT CONTEXTUAL CREDENTIALS PANEL -->
<aside id="credentialsPanel" class="credentials-panel">
  <button id="closePanelBtn" class="close-panel-btn" aria-label="Close details">×</button>
  <div class="panel-content">
    <div id="panelCategory" class="panel-category">Category</div>
    <h2 id="panelTitle" class="panel-title">Image Title</h2>
    <div id="panelMeta" class="panel-meta">Location • Year</div>
    
    <hr class="panel-divider">
    
    <!-- Dynamic Special Field Section (Exhibitions or Magazine) -->
    <div id="panelDynamicSection" class="panel-dynamic-section"></div>
  </div>
</aside>
      
      <!-- BOTTOM META & CONTROLS FOOTER -->
      <footer class="meta-footer">
        <div class="meta-left">
          <span class="category-tag" id="photoTag">#ogalanets</span>
          <span class="divider">|</span>
          <span class="photo-title" id="photoTitle">Olga Galanets</span>
        </div>
        
        <div class="meta-right">
          <span id="counter" class="counter">01 / 04</span>
          <div class="nav-arrows">
            <button id="prevBtn" class="nav-arrow" aria-label="Previous Image">←</button>
            <button id="nextBtn" class="nav-arrow" aria-label="Next Image">→</button>
          </div>
        </div>
      </footer>
    </main>
  </div>

  <script src="js/pwscript.js" defer></script>
</body>
</html>
